<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cocina | Censa Gourmet</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/chef.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <a href="../index.html" class="logo">✦ Censa <span>Gourmet</span> - Cocina</a>
        
        <div class="user-nav">
            <div class="user-badge">
                <span>👨‍🍳 Chef:</span>
                <span id="user-name-display">Cargando...</span>
            </div>
            <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="dashboard-container">
        <h2 class="section-title">🔥 Comandas en Cola</h2>
        
        <div id="tablero-cocina" class="comandas-grid">
            <p style="text-align: center; color: #888; width: 100%; padding: 40px;">Cargando pedidos...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Censa Gourmet. Módulo de Cocina.</p>
    </footer>

    <!-- Supabase JS Module -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const supabaseUrl = 'https://xapucgyfhswgudkraeuz.supabase.co';
        const supabaseKey = 'sb_publishable_tL2gtRtP68PEu0A86Qg2_Q_EeysDviw';
        const supabase = createClient(supabaseUrl, supabaseKey);

        let currentUser = null;

        // 1. Inicialización y Autenticación
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();

            if (!session) {
                window.location.href = './login.html';
                return;
            }
            currentUser = session.user;

            let nombre = localStorage.getItem('nombreUsuario');
            if (!nombre) {
                const { data: perfil } = await supabase
                    .from('usuarios')
                    .select('nombre')
                    .eq('id', currentUser.id)
                    .single();
                nombre = (perfil && perfil.nombre) ? perfil.nombre : currentUser.email.split('@')[0];
            }
            document.getElementById('user-name-display').textContent = nombre;

            await cargarTableroCocina();

            // Tiempo Real: Escuchar cambios en la tabla comandas
            supabase
                .channel('realtime_cocina')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'comandas' }, () => {
                    cargarTableroCocina();
                })
                .subscribe();
        });

        // Logout
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabase.auth.signOut();
            localStorage.clear();
            window.location.href = '../index.html';
        });

        // 2. Cargar Comandas Pendientes y En Proceso
        async function cargarTableroCocina() {
            const contenedor = document.getElementById('tablero-cocina');

            // Solo traemos pendientes o en proceso. Orden ascendente (el más viejo arriba)
            const { data: comandas, error } = await supabase
                .from('comandas')
                .select('*, mesas(numero), comanda_detalles(*, platos(nombre))')
                .in('estado', ['pendiente', 'en_proceso'])
                .order('created_at', { ascending: true });

            if (error) {
                console.error("Error al cargar comandas:", error);
                contenedor.innerHTML = '<p style="color: #e74c3c; grid-column: 1/-1;">Error al obtener comandas.</p>';
                return;
            }

            if (!comandas || comandas.length === 0) {
                contenedor.innerHTML = '<div class="empty-state">No hay pedidos en cola. ¡Excelente trabajo! 👨‍🍳✨</div>';
                return;
            }

            contenedor.innerHTML = '';

            comandas.forEach(com => {
                const card = document.createElement('div');
                const estadoClase = com.estado === 'pendiente' ? 'card-pendiente' : 'card-proceso';
                card.className = `ticket-cocina ${estadoClase}`;

                const numMesa = com.mesas ? `MESA ${com.mesas.numero}` : 'MESA N/A';
                
                // Formatear la hora de creación
                const hora = new Date(com.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const itemsList = com.comanda_detalles && com.comanda_detalles.length > 0 
                    ? com.comanda_detalles.map(d => `
                        <li class="ticket-item">
                            <span class="qty">${d.cantidad}x</span> 
                            <span class="plat">${d.platos ? d.platos.nombre : 'Plato desconocido'}</span>
                        </li>`).join('')
                    : '<li>Sin detalles</li>';

                // Mostrar notas de alergias/celebración si existen y no son "N/A"
                let alertHTML = '';
                if (com.notas && com.notas.trim() !== '' && !com.notas.includes('[🎉 Celebración: N/A] | [⚠️ Alergias: N/A]')) {
                    alertHTML = `<div class="ticket-alert">🛑 NOTAS: ${com.notas}</div>`;
                }

                // Lógica de botones según estado
                let botonesHTML = '';
                if (com.estado === 'pendiente') {
                    botonesHTML = `
                        <button class="btn-chef btn-cancel" onclick="actualizarEstado('${com.id}', 'cancelado')">🚫 Cancelar Pedido</button>
                        <button class="btn-chef btn-prepare" onclick="actualizarEstado('${com.id}', 'en_proceso')">🍳 Preparar Pedido</button>
                    `;
                } else if (com.estado === 'en_proceso') {
                    botonesHTML = `
                        <button class="btn-chef btn-ready" onclick="actualizarEstado('${com.id}', 'listo')">🔔 ¡Listo para Entregar!</button>
                    `;
                }

                card.innerHTML = `
                    <div class="ticket-header">
                        <span class="mesa">${numMesa}</span>
                        <span class="hora">⏱️ ${hora}</span>
                    </div>
                    ${alertHTML}
                    <ul class="ticket-body">
                        ${itemsList}
                    </ul>
                    <div class="ticket-footer">
                        ${botonesHTML}
                    </div>
                `;

                contenedor.appendChild(card);
            });
        }

        // 3. Actualizar Estado de la Comanda
        window.actualizarEstado = async (comandaId, nuevoEstado) => {
            let mensajeConfirmacion = "";
            if (nuevoEstado === 'cancelado') mensajeConfirmacion = "¿Seguro que deseas rechazar/cancelar este pedido?";
            if (nuevoEstado === 'en_proceso') mensajeConfirmacion = "¿Comenzar a preparar este pedido?";
            if (nuevoEstado === 'listo') mensajeConfirmacion = "¿Marcar este pedido como LISTO para que el mesero lo recoja?";

            if (mensajeConfirmacion && !confirm(mensajeConfirmacion)) return;

            const { error } = await supabase
                .from('comandas')
                .update({ estado: nuevoEstado })
                .eq('id', comandaId);

            if (error) {
                alert("Error al actualizar la comanda: " + error.message);
            } else {
                cargarTableroCocina();
            }
        };
    </script>
</body>
</html>
