
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Restaurante Censa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            background-color: #252525;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #10b981;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-buttons a {
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn-login {
            color: #10b981;
            border: 2px solid #10b981;
        }

        .btn-login:hover {
            background-color: rgba(16, 185, 129, 0.1);
        }

        .btn-register {
            background-color: #10b981;
            color: white;
            border: 2px solid #10b981;
        }

        .btn-register:hover {
            background-color: #059669;
            border-color: #059669;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
            margin-top: 50px;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.2rem;
            color: #aaaaaa;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
                flex-direction: column;
                justify-content: center;
                text-align: center;
            }

            .logo {
                font-size: 1.3rem;
            }

            .nav-buttons {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .nav-buttons a {
                padding: 8px 16px;
                font-size: 0.9rem;
            }

            .hero {
                padding: 60px 20px;
                margin-top: 20px;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1rem;
            }
        }

        @media (max-width: 400px) {
            .nav-buttons {
                flex-direction: column;
                width: 100%;
            }

            .nav-buttons a {
                width: 100%;
                text-align: center;
                margin: 0;
            }

            .hero h1 {
                font-size: 1.6rem;
            }

            .hero p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🍽️ Restaurante Censa</div>
        <div class="nav-buttons">
            <a href="login.html" class="btn-login">Iniciar Sesión</a>
            <a href="login.html" class="btn-register">Registrarse</a>
        </div>
    </header>

    <section class="hero">
        <h1>Bienvenido a Restaurante Censa</h1>
        <p>El mejor sistema para gestionar tus reservas, comandas y menú.</p>
    </section>

</body>
</html>
